#    maturin generate-ci github

name: Python Tests

on:
  pull_request:
  workflow_call:
  push:
    branches:
      - stable
  workflow_dispatch:

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dnsmasq
        run: sudo apt-get update && sudo apt-get install -y dnsmasq

      - name: Start test DNS server
        run: sudo ./scripts/start-test-dns.sh

      - name: Start AXFR test server
        run: ./scripts/start-test-axfr.sh

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Python dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Build Python extension
        run: uv run maturin develop --release

      - name: Run Python tests
        run: uv run pytest blastdns/tests -vv
      
      - name: Stop AXFR test server
        if: always()
        run: ./scripts/stop-test-axfr.sh || true

      - name: Stop test DNS server
        if: always()
        run: sudo ./scripts/stop-test-dns.sh || true

