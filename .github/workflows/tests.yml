name: Tests

on:
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    uses: blacklanternsecurity/release-workflows/.github/workflows/rust-tests.yml@c53c202eedeb26a86088936363e6cb06ce99ac15 # v1.0.0
    with:
      cargo-args: --all --locked
      test-args: --include-ignored
      setup-script: scripts/ci-setup.sh
      teardown-script: scripts/ci-teardown.sh

  clippy-python-feature:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  python:
    uses: blacklanternsecurity/release-workflows/.github/workflows/python-tests.yml@c53c202eedeb26a86088936363e6cb06ce99ac15 # v1.0.0
    with:
      pytest-args: blastdns/tests tests/cli_tests.py -vv
      setup-script: scripts/ci-setup.sh
      teardown-script: scripts/ci-teardown.sh

  # Reports the contexts the protecc ruleset requires today. Remove once it requires rust / passed and python / passed.
  required:
    name: ${{ matrix.context }}
    if: always()
    needs: [rust, clippy-python-feature, python]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        context: ["python-tests (3.11)", "python-tests (3.12)", "python-tests (3.13)", "python-tests (3.14)", "python-tests (3.15)", rust-tests]
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
