name: Tests

on:
  pull_request:
  push:
    branches: [stable]
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    uses: blacklanternsecurity/CLA/.github/workflows/rust-tests.yml@de82726743e51ac51a1be31196d893312a9fea59 # main
    with:
      cargo-args: --all --locked
      test-args: --include-ignored
      setup-script: scripts/ci-setup.sh
      teardown-script: scripts/ci-teardown.sh

  python:
    uses: blacklanternsecurity/CLA/.github/workflows/python-tests.yml@de82726743e51ac51a1be31196d893312a9fea59 # main
    with:
      pytest-args: blastdns/tests tests/cli_tests.py -vv
      setup-script: scripts/ci-setup.sh
      teardown-script: scripts/ci-teardown.sh
